name: 额度日报

# 每天定时检查 Cloudflare 免费额度占用，超过阈值就在 Issue 里留一条记录。
#
# 为什么用定时任务而不是「等报错再查」：
#   免费额度是硬上限，撞到之后请求直接失败。
#   等用户发现异常时，故障已经发生了。主动巡检能在撞墙前给出预警。
#
# ⚠️ 配置是可选的 —— 没配 CF_API_TOKEN 时本任务会**优雅跳过**，
#    不会在 Actions 里刷红叉（实测踩过：连续多天 failure 看着像仓库坏了）。
#
# 配置：仓库 Settings → Secrets and variables → Actions 添加：
#   CF_API_TOKEN    必需（Account Analytics:Read + Zone:Read）
#   CF_ACCOUNT_ID   可选，多账号时必需
# 再加变量（Variables，不是 Secret）：
#   QUOTA_ALERT_THRESHOLD  可选，默认 80（百分比）

on:
  schedule:
    # 每天 UTC 23:00（北京时间 7:00）—— 在 UTC 额度重置前 1 小时检查
    - cron: '0 23 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ─── 先检查 Secret 是否配置 ───
      #
      # ⚠️ 这一步决定后面所有步骤跑不跑。
      #    原来直接在采集步骤里报 error + exit 1，
      #    结果是「没配 Secret」= 每天一个失败记录。
      #    改成：没配就发一条 notice 然后跳过，不算失败。
      - name: 检查配置
        id: guard
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过额度巡检::未配置 CF_API_TOKEN，本任务跳过。配置方法见 .github/workflows/quota-report.yml 顶部注释。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 采集用量
        if: steps.guard.outputs.configured == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          node bin/cfm.mjs usage --json > usage.json
          echo "--- 采集结果 ---"
          cat usage.json

      - name: 分析阈值
        if: steps.guard.outputs.configured == 'true'
        id: analyze
        env:
          THRESHOLD: ${{ vars.QUOTA_ALERT_THRESHOLD || '80' }}
        run: |
          node - <<'EOF' > report.md
          import fs from 'node:fs';

          const data = JSON.parse(fs.readFileSync('usage.json', 'utf8'));
          const threshold = Number(process.env.THRESHOLD || 80);

          const rows = [];
          const alerts = [];

          function check(label, used, limit, unit) {
            if (used === null || used === undefined || !limit) return;
            const pct = (used / limit) * 100;
            const barLen = Math.min(20, Math.round(pct / 5));
            const bar = '#'.repeat(barLen).padEnd(20, '-');
            rows.push(`| ${label} | ${used.toLocaleString()} / ${limit.toLocaleString()} ${unit || ''} | ${pct.toFixed(1)}% | \`${bar}\` |`);
            if (pct >= threshold) {
              alerts.push(`- **${label}**：${pct.toFixed(1)}%（阈值 ${threshold}%）`);
            }
          }

          // 按实际数据结构展开
          const u = data.usage || data;
          for (const [key, v] of Object.entries(u)) {
            if (v && typeof v === 'object' && 'used' in v) {
              check(v.label || key, v.used, v.limit, v.unit);
            }
          }

          console.log('# Cloudflare 免费额度日报');
          console.log('');
          console.log(`> 采集时间：${new Date().toISOString()}`);
          console.log('');
          if (alerts.length) {
            console.log(`## 警告：${alerts.length} 项超过 ${threshold}%`);
            console.log('');
            alerts.forEach((a) => console.log(a));
            console.log('');
          } else {
            console.log(`全部资源均在 ${threshold}% 以下，无需处理。`);
            console.log('');
          }
          console.log('## 明细');
          console.log('');
          console.log('| 资源 | 用量 | 占比 | 进度 |');
          console.log('|:--|:--|:--|:--|');
          rows.forEach((r) => console.log(r));
          EOF
          echo "report generated"
          cat report.md

      - name: 发布到 Issue
        if: steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 已有则更新，没有则创建（幂等，不刷屏）
          TITLE="额度日报"
          BODY="$(cat report.md)"

          EXISTING=$(gh issue list --search "in:title "$TITLE"" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "已追加到 Issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "已创建 Issue"
          fi
