name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：CI 只需要读代码
permissions:
  contents: read

jobs:
  test:
    name: 测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 检查行尾（跨平台铁律）
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::包含 CRLF 行尾，跨平台仓库必须用 LF"
              bad=1
            fi
          done < <(git ls-files '*.mjs' '*.js' '*.json' '*.yml' '*.yaml' '*.md' '*.sh')
          exit $bad

      - name: 静态检查
        run: node scripts/lint.mjs

      # 显式列举测试文件：Node 18/20 不支持 `node --test "test/**/*.test.mjs"`
      # 这种 glob 展开，会当成字面路径报 "Could not find"。实测踩过。
      - name: 单元测试
        run: node --test test/unit.test.mjs test/ui.test.mjs test/e2e.test.mjs

      - name: 交互逻辑测试（纯函数层，无需终端）
        run: node scripts/ui-logic-test.mjs

      - name: 验证所有命令可加载（捕捉 node --check 查不出的未定义导入）
        run: |
          set -e
          for cmd in help whoami doctor quota usage dns cache zone r2 pages workers kv d1 tunnel audit; do
            echo "→ 加载 $cmd"
            node -e "import('./src/cmd/$cmd.mjs').then(m => {
              if (typeof m.run !== 'function') { console.error('$cmd 没有导出 run()'); process.exit(1) }
            }).catch(e => { console.error('$cmd 加载失败:', e.message); process.exit(1) })"
          done
          echo "✔ 全部命令模块加载正常"

      - name: 验证无凭据时给出清晰错误
        run: |
          set -e
          unset CF_API_TOKEN CF_API_KEY CF_API_EMAIL || true
          out=$(node bin/cfm.mjs whoami 2>&1 || true)
          echo "$out"
          if ! echo "$out" | grep -q "未找到 Cloudflare 凭据"; then
            echo "::error::无凭据时应给出明确提示"
            exit 1
          fi

      - name: 检查 shell 脚本（语法 + 行尾 + 可执行位）
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do
            echo "→ $f"
            bash -n "$f"

            # 行尾必须是 LF —— CRLF 的 shell 脚本在 Linux 上会报
            # bash: $'\r': command not found
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::含 CRLF 行尾"
              exit 1
            fi

            # 可执行位 —— git archive 在 Windows 上会丢，用 tarfile 手工打包时要注意
            if ! git ls-files -s "$f" | grep -q '^100755'; then
              echo "::warning file=$f::缺少可执行位（git update-index --chmod=+x $f）"
            fi
          done

      - name: shell 脚本在无凭据时应干净退出
        run: |
          set -e
          unset CF_API_TOKEN || true
          out=$(bash scripts/cf-quick-check.sh 2>&1) && code=0 || code=$?
          echo "$out"
          if [ "$code" != "2" ]; then
            echo "::error::无凭据时脚本应以退出码 2 结束，实际 $code"
            exit 1
          fi

  windows:
    name: 测试（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 静态检查
        run: node scripts/lint.mjs

      # 显式列举测试文件：Node 18/20 不支持 `node --test "test/**/*.test.mjs"`
      # 这种 glob 展开，会当成字面路径报 "Could not find"。实测踩过。
      - name: 单元测试
        run: node --test test/unit.test.mjs test/ui.test.mjs test/e2e.test.mjs

      - name: 交互逻辑测试（纯函数层，无需终端）
        run: node scripts/ui-logic-test.mjs

      # Windows 上最容易出的问题是路径分隔符与编码
      - name: 验证路径处理
        run: node bin/cfm.mjs quota workers
        shell: pwsh
